# Vintage Visuals - one-sampler terrain material restoration checkpoint.
#
# This is deliberately separate from pseudopbr/pseudopbrtopsoil. It restores
# only the primary material atlas path and the debug views that can be answered
# by that one resource.

- type: assert
  phase: Assertions
  filename: chunkopaque.fsh
  tokens: in vec2 uv;

- type: assert
  phase: Assertions
  filename: chunkopaque.fsh
  tokens: in vec3 normal;

- type: assert
  phase: Assertions
  filename: chunkopaque.fsh
  tokens: in vec4 worldPos;

- type: assert
  phase: Assertions
  filename: chunkopaque.fsh
  tokens: in vec4 rgbaFog;

- type: assert
  phase: Assertions
  filename: chunkopaque.fsh
  tokens: in vec3 blockLight;

- type: assert
  phase: Assertions
  filename: chunkopaque.fsh
  tokens: uniform vec3 lightPosition;

- type: insert_after
  phase: Declarations
  filename: chunkopaque.fsh
  tokens: uniform sampler2D liquidDepth;
  snippet: pbrterrainmaterial.glsl

- type: insert_before
  phase: Material
  filename: chunkopaque.fsh
  tokens: outGlow = vec4(glowLevel + glow, godrayLevel, 0, min(1, fogAmount + outColor.a));
  content: |
    outColor = vvTerrainMaterialPrimary(outColor, texColor.rgb, normal, uv, worldPos.xyz, b, fogAmount, murkiness, rgbaFog.rgb, blockLight);
    outColor = vvTerrainMaterialPrimaryDebug(outColor, texColor.rgb, normal, uv, worldPos.xyz, b, fogAmount, murkiness, rgbaFog.rgb, blockLight);
    glow += vvTerrainEmissiveGlow(glowLevel, uv);

- type: assert
  phase: Assertions
  filename: chunktopsoil.fsh
  tokens: in vec2 uv;

- type: assert
  phase: Assertions
  filename: chunktopsoil.fsh
  tokens: in vec3 normal;

- type: assert
  phase: Assertions
  filename: chunktopsoil.fsh

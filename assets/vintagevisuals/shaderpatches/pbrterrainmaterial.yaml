  snippet: pbrterrainmaterial.glsl

- type: insert_before
  phase: Material
  filename: chunktopsoil.fsh
  tokens: outGlow = vec4(glowLevel + glow, 0, 0, outColor.a);
  content: |
    outColor = vvTerrainMaterialPrimary(outColor, outColor.rgb, normal, uv, worldPos.xyz, 1.0, fogAmount, murkiness, rgbaFog.rgb, blockLight);
    outColor = vvTerrainMaterialPrimaryDebug(outColor, outColor.rgb, normal, uv, worldPos.xyz, 1.0, fogAmount, murkiness, rgbaFog.rgb, blockLight);
    glow += vvTerrainEmissiveGlow(glowLevel, uv);

# Vintage Visuals - one-sampler terrain material restoration checkpoint.
#
# This is deliberately separate from pseudopbr/pseudopbrtopsoil. It owns the
# two material atlas samplers, the shared scene and lighting snippets, and the
# terrain features restored on top of them. Features that need a resource of
# their own (a sampler, a varying) get a patch group of their own.

- type: assert
  phase: Assertions
  filename: chunkopaque.fsh
  tokens: in vec2 uv;

- type: assert
  phase: Assertions
  filename: chunkopaque.fsh
  tokens: in vec3 normal;

- type: assert
  phase: Assertions
  filename: chunkopaque.fsh
  tokens: in vec4 worldPos;

- type: assert
  phase: Assertions
  filename: chunkopaque.fsh
  tokens: in vec4 rgbaFog;

- type: assert
  phase: Assertions
  filename: chunkopaque.fsh
  tokens: in vec3 blockLight;

- type: assert
  phase: Assertions
  filename: chunkopaque.fsh
  tokens: uniform vec3 lightPosition;

# The shared scene vocabulary and the shared lighting core, injected the way
# the entity and particle groups inject them: once per program, by this group,
# so this group can still roll back to vanilla on its own. Both snippets paste
# their anchor back, which is why these are explicit replaces.
- type: replace
  phase: Declarations
  filename: chunkopaque.fsh
  tokens: in vec4 rgbaFog;
  snippet: scene.glsl

- type: replace
  phase: Declarations
  filename: chunkopaque.fsh
  tokens: uniform vec3 lightPosition;
  snippet: pbrcore.glsl

- type: insert_after
  phase: Declarations
  filename: chunkopaque.fsh
  tokens: uniform sampler2D liquidDepth;
  snippet: pbrterrainmaterial.glsl

- type: insert_before
  phase: Material
  filename: chunkopaque.fsh
  tokens: outGlow = vec4(glowLevel + glow, godrayLevel, 0, min(1, fogAmount + outColor.a));
  content: |
    vv_vanillaNormalShade = nb;
    outColor = vvTerrainMaterialPrimary(outColor, texColor.rgb, normal, uv, worldPos.xyz, b, fogAmount, murkiness, rgbaFog.rgb, blockLight, glowLevel);
    outColor = vvTerrainMaterialPrimaryDebug(outColor, texColor.rgb, normal, uv, worldPos.xyz, b, fogAmount, murkiness, rgbaFog.rgb, blockLight, glowLevel);
    glow += vvTerrainEmissiveGlow(glowLevel, uv);
    glow += vv_fleckGlow * (1.0 - fogAmount);
    godrayLevel = min(1.0, godrayLevel + vvTerrainShaftLevel(worldPos.xyz, fogDensityIn));
    outColor.rgb += vvTerrainBeamColor() * (vvTerrainBeamInscatter(worldPos.xyz, fogDensityIn) * (1.0 - fogAmount));

- type: assert
  phase: Assertions
  filename: chunktopsoil.fsh
  tokens: in vec2 uv;

- type: assert
  phase: Assertions
  filename: chunktopsoil.fsh
  tokens: in vec3 normal;

- type: assert
  phase: Assertions
  filename: chunktopsoil.fsh
  tokens: in vec4 worldPos;

- type: assert
  phase: Assertions
  filename: chunktopsoil.fsh
  tokens: in vec4 rgbaFog;

- type: assert
  phase: Assertions
  filename: chunktopsoil.fsh
  tokens: in vec3 blockLight;

- type: assert
  phase: Assertions
  filename: chunktopsoil.fsh
  tokens: uniform vec3 lightPosition;

# The shared scene vocabulary and the shared lighting core, injected the way
# the entity and particle groups inject them: once per program, by this group,
# so this group can still roll back to vanilla on its own. Both snippets paste
# their anchor back, which is why these are explicit replaces.
- type: replace
  phase: Declarations
  filename: chunktopsoil.fsh
  tokens: in vec4 rgbaFog;
  snippet: scene.glsl

- type: replace
  phase: Declarations
  filename: chunktopsoil.fsh
  tokens: uniform vec3 lightPosition;
  snippet: pbrcore.glsl

- type: insert_after
  phase: Declarations
  filename: chunktopsoil.fsh
  tokens: uniform sampler2D liquidDepth;
  snippet: pbrterrainmaterial.glsl

- type: insert_before
  phase: Material
  filename: chunktopsoil.fsh
  tokens: outGlow = vec4(glowLevel + glow, 0, 0, outColor.a);
  content: |
    vv_vanillaNormalShade = getBrightnessFromNormal(normal, 1, intensity);
    outColor = vvTerrainMaterialPrimary(outColor, outColor.rgb, normal, uv, worldPos.xyz, 1.0, fogAmount, murkiness, rgbaFog.rgb, blockLight, glowLevel);
    outColor = vvTerrainMaterialPrimaryDebug(outColor, outColor.rgb, normal, uv, worldPos.xyz, 1.0, fogAmount, murkiness, rgbaFog.rgb, blockLight, glowLevel);
    glow += vvTerrainEmissiveGlow(glowLevel, uv);
    glow += vv_fleckGlow * (1.0 - fogAmount);
    outColor.rgb += vvTerrainBeamColor() * (vvTerrainBeamInscatter(worldPos.xyz, 0.00125) * (1.0 - fogAmount));

# --- vertex shaders: sky exposure for the weather on terrain ------------------
#
# In THIS group because the fragment half (`in float vv_sunExposure;` in
# pbrterrainmaterial.glsl) belongs to it: a varying is a contract between the
# .vsh and .fsh of one program, and if the vertex half could roll back alone
# the program would not link and the world would stop drawing. A group fails
# as a unit, so both halves apply or neither does.
#
# rgbaLightIn.a is vanilla's per-vertex sun light level, 0 under a roof and 1 in
# the open. It just never reaches the fragment stage on its own.
#
# rgbaLightIn.rgb is the BLOCK light alone - torches, lanterns, lava - with its
# falloff, per vertex (D67b). Vanilla's own `blockLight` varying is not that:
# it is written only when dynamic lights are on, and then holds the sun and
# block colours MIXED by brightness, so it is about as bright in daylight as
# beside a torch. Every terrain torch effect read it until D67b, which is why
# a torch shaded a whole room evenly and nothing near the flame changed.

- type: insert_after
  phase: Declarations
  filename: chunkopaque.vsh
  tokens: out vec3 blockLight;
  content: |
    out float vv_sunExposure; // vintagevisuals: sky exposure for weather on terrain
    out vec3 vv_blockLight;   // vintagevisuals: the torch light alone (D67b)

- type: insert_after
  phase: Material
  filename: chunkopaque.vsh
  tokens: rgba = applyLight(rgbaAmbientIn, rgbaLightIn, renderFlags, camPos);
  content: |
    vv_sunExposure = rgbaLightIn.a; // chunkopaque
    vv_blockLight = rgbaLightIn.rgb; // chunkopaque

- type: insert_after
  phase: Declarations
  filename: chunktopsoil.vsh
  tokens: out vec3 blockLight;
  content: |
    out float vv_sunExposure; // vintagevisuals: sky exposure for weather on terrain
    out vec3 vv_blockLight;   // vintagevisuals: the torch light alone (D67b)

- type: insert_after
  phase: Material
  filename: chunktopsoil.vsh
  tokens: rgba = applyLight(rgbaAmbientIn, rgbaLightIn, renderFlags, cameraPos);
  content: |
    vv_sunExposure = rgbaLightIn.a; // chunktopsoil
    vv_blockLight = rgbaLightIn.rgb; // chunktopsoil

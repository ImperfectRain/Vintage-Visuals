# Vintage Visuals - scene reflection bridge on the modular terrain path.
#
# Owns the scene-capture sampler, so it is its own group: if it fails it rolls
# back to the material path alone, and the material path never depends on it.
# chunkopaque only - topsoil is grass and dirt tops, which do not reflect.
#
# Asserting the material group's debug entry point makes this group fail
# closed rather than declare a sampler into a program the material path did
# not patch. afterGroups only orders; the assert is what enforces.

- type: assert
  phase: Assertions
  filename: chunkopaque.fsh
  after: pbrterrainmaterial
  tokens: vec4 vvTerrainMaterialPrimaryDebug(

- type: assert
  phase: Assertions
  filename: chunkopaque.fsh
  after: pbrterrainmaterial
  tokens: uniform sampler2D liquidDepth;

# Directly above main: below vanilla's last sampler, so link-time unit
# assignment of vanilla's samplers is unchanged, and below the material
# snippet, whose debug uniform this reads.
- type: insert_before
  phase: Declarations
  filename: chunkopaque.fsh
  after: pbrterrainmaterial
  tokens: void main()
  snippet: pbrterrainreflect.glsl

- type: insert_before
  phase: FinalOutput
  filename: chunkopaque.fsh
  after: pbrterrainmaterial
  tokens: outGlow = vec4(glowLevel + glow, godrayLevel, 0, min(1, fogAmount + outColor.a));
  content: |
    outColor = vvTerrainReflectDebug(outColor);

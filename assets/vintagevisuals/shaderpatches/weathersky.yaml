# Vintage Visuals - weather fog in the sky shader
#
# Its own group. The sky is drawn by a different program and shares nothing with
# the terrain patches, so a reworded line here should dim the sky's response to
# rain and leave the ground's alone.

- type: token
  filename: sky.fsh
  tokens: "vec4 applyFog(vec4 rgbaPixel, float fogWeight) {"
  snippet: weathersky.glsl

- type: token
  filename: sky.fsh
  tokens: "return vec4(mix(rgbaPixel.rgb, rgbaFog.rgb, fogWeight), rgbaPixel.a);"
  content: |
    return vec4(mix(rgbaPixel.rgb, vvWeatherFogColor(rgbaFog.rgb), vvWeatherFogAmount(fogWeight)), rgbaPixel.a);

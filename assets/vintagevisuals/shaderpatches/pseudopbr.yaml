# Vintage Visuals - pseudo-PBR patches against vanilla chunkopaque.fsh
#
# Verified against 1.22.7's own chunkopaque.fsh as the game hands it to the
# shader compiler. Three things about that file drive every decision here:
#
#  1. #include directives are ALREADY EXPANDED when this mod sees the source.
#     chunkopaque.fsh arrives as one ~1180-line file with vertexflagbits.ash,
#     fogandlight.fsh and colormap.fsh inlined. So fogandlight.fsh is not a
#     separate patch target, and position within the flat file matters.
#
#  2. DECLARATION ORDER OF SAMPLERS MATTERS. Adding a sampler above vanilla's
#     shifts the ones below it by a unit when the program links. Injecting at
#     the top of the file pushed liquidDepth off the end, which made
#     getUnderwaterMurkiness() saturate and mixed every fragment this shader
#     draws to waterMurkColor  -  in game, a world that looked transparent with
#     only grass tops left. The injection is therefore anchored on
#     `uniform sampler2D liquidDepth`, the LAST sampler vanilla declares, and
#     must stay there. It is still above main(), and still below
#     `uniform vec3 lightPosition`, which the snippet needs.
#
#  3. Normal shading moved to the VERTEX shader. 1.22.7 does not call
#     applyFogAndShadowWithNormal at all  -  the function is still defined but
#     dead. main() reads a per-vertex `nb` varying instead, so that is the
#     value the relief has to modulate.
#
# Group defaults to this file's name ("pseudopbr"). Every entry succeeds or
# fails as one unit: if any anchor stops matching, the loader rolls
# chunkopaque.fsh back to vanilla and the subsystem goes inert. The mod system
# also skips this whole group unless PseudoPBR.Enabled is set, so an install
# that does not want it compiles vanilla source rather than muted patched
# source.

# 1. Assert `uv`, so patches 4 and 5 can pass it safely.
#
# Semantically a no-op and load-bearing anyway: without it, a vanilla rename
# would leave the injected calls referencing an undeclared variable and
# chunkopaque.fsh would fail to COMPILE, costing the player the entire world
# render instead of one effect.
- type: token
  filename: chunkopaque.fsh
  tokens: in vec2 uv;
  content: |
    in vec2 uv; // vintagevisuals: varying name asserted by pseudopbr.yaml

# 2. Assert `normal` for the same reason.
- type: token
  filename: chunkopaque.fsh
  tokens: in vec3 normal;
  content: |
    in vec3 normal; // vintagevisuals: varying name asserted by pseudopbr.yaml

# 2b. Assert `rgbaFog`, which stands in for the sky in the ambient specular
# term. Vanilla blends the horizon toward it, which makes it a better
# environment estimate than any constant this mod could pick.
- type: token
  filename: chunkopaque.fsh
  tokens: in vec4 rgbaFog;
  content: |
    in vec4 rgbaFog; // vintagevisuals: varying name asserted by pseudopbr.yaml

# 2c. Assert `blockLight`, the per-vertex colour vanilla bakes every torch,
# lantern, lava pool and glowing block into. It is the only handle this shader
# has on light that is not the sun.
- type: token
  filename: chunkopaque.fsh
  tokens: in vec3 blockLight;
  content: |
    in vec3 blockLight; // vintagevisuals: varying name asserted by pseudopbr.yaml

# 3. Assert `lightPosition`, and inject the shared microfacet core here.
#
# Two jobs in one patch because they want the same place. The core needs
# lightPosition and blockLight declared above it and nothing else, and it must
# land ABOVE the material snippet that calls it - GLSL wants a declaration
# before its use, and the material snippet is anchored on the last sampler for
# reasons note 2 explains at length.
#
# pbrcore.glsl is the same file the entity group injects. One evaluation of
# Cook-Torrance, three programs, no copies to keep in step.
- type: token
  filename: chunkopaque.fsh
  tokens: uniform vec3 lightPosition;
  snippet: pbrcore.glsl

# 4. Inject the sampler, the uniforms and the shading functions  -  after every
#    vanilla sampler, and before main(). See note 2; this is not a free choice.
- type: token
  filename: chunkopaque.fsh
  tokens: uniform sampler2D liquidDepth;
  snippet: pseudopbr.glsl

# 5. Relief and specular, at the point vanilla composes the lit colour.
#
# The full statement is the anchor rather than the `min(b, nb)` fragment inside
# it: that fragment appears twice in the file, and the patch engine rejects an
# ambiguous anchor rather than guessing.
#
# nb is wrapped, not the min, so shadow keeps its authority and relief cannot
# light up a face the shadow map says is dark.
#
# The microfacet pass then runs on the finished lit colour: it takes energy out
# of the diffuse and adds the specular lobe back, using vanilla's own shadow,
# fog and murkiness terms so a highlight cannot appear where the light does not
# reach. texColor is passed as the albedo - it is the colour-mapped diffuse,
# which is what the reflectance model needs to tint a metal's highlight.
- type: token
  filename: chunkopaque.fsh
  tokens: outColor = applyFogAndShadowFromBrightness(texColor, clamp(fogAmount - 50*murkiness, 0, 1), min(b, nb), worldPos.xyz);
  content: |
    outColor = applyFogAndShadowFromBrightness(texColor, clamp(fogAmount - 50*murkiness, 0, 1), min(b, vvSurfaceBrightness(nb, normal, uv, worldPos.xyz)), worldPos.xyz);
    outColor = vvApplyPbr(outColor, texColor.rgb, normal, uv, worldPos.xyz, b, fogAmount, murkiness, rgbaFog.rgb, blockLight);

# 6. Debug layer views, applied last so they replace the finished colour.
#
# Anchored on the outGlow write, which is the last statement in main() and the
# only point where outColor is final.
- type: token
  filename: chunkopaque.fsh
  tokens: outGlow = vec4(glowLevel + glow, godrayLevel, 0, min(1, fogAmount + outColor.a));
  content: |
    outColor = vvDebugView(outColor, normal, uv, worldPos.xyz, b, fogAmount, murkiness, rgbaFog.rgb, blockLight);
    outGlow = vec4(glowLevel + glow, godrayLevel, 0, min(1, fogAmount + outColor.a));

# --- vertex shader: sky exposure for the weather system ---------------------
#
# In THIS group, not a weather group of its own, and that is not tidiness. A
# varying is a contract between the .vsh and the .fsh of one program: the
# fragment side declares `in float vv_sunExposure` and reads it, so if the
# vertex side failed to apply independently the program would not link and the
# world would stop drawing. Both halves succeed or both roll back.
#
# Vanilla already knows the answer - rgbaLightIn.a is the per-vertex sun light
# level, 0 under a roof and 1 in the open - it just never reaches the fragment
# stage. Rain cannot wet a surface the sky cannot see, and this is the only
# signal in either chunk shader that knows the difference.

- type: token
  filename: chunkopaque.vsh
  tokens: out vec3 blockLight;
  content: |
    out vec3 blockLight;

    // vintagevisuals: sky exposure for the weather system
    out float vv_sunExposure;

- type: token
  filename: chunkopaque.vsh
  tokens: rgba = applyLight(rgbaAmbientIn, rgbaLightIn, renderFlags, camPos);
  content: |
    rgba = applyLight(rgbaAmbientIn, rgbaLightIn, renderFlags, camPos);
    vv_sunExposure = rgbaLightIn.a;

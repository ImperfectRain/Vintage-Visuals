# --- entityanimated.fsh -----------------------------------------------------
#
# The program this whole move was for. Every atmospheric effect this mod had
# stopped at the terrain, so an entity was the one thing in a hazy scene that
# never got hazier.

- type: token
  filename: entityanimated.fsh
  tokens: "vec4 applyFog(vec4 rgbaPixel, float fogWeight) {"
  snippet: atmosphere.glsl

- type: token

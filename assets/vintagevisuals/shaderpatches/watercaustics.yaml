# Vintage Visuals - water caustics compiled in only while they are on
# (patch group "watercaustics", chunkliquid.fsh, D93).
#
# The caustic web (water.glsl, vvWaterCausticWeb and step 8 of the
# composition) is inside `#ifdef VV_WATER_CAUSTICS`, and this group is the
# only thing that defines it. It is applied only while Water.Enabled is on and
# Water.Caustics is above 0 (see IsPatchGroupEnabled); moving the slider to 0
# or back reloads the shaders once. Without the group the water is exactly
# the composition with no web, and carries none of its registers (D90: code
# that never runs still costs occupancy).
#
# It touches no sampler and no uniform. The define lands at the top of the
# water snippet, above everything that tests it, so it asserts that snippet's
# first uniform and must run after the water group.

- type: assert
  phase: Assertions
  filename: chunkliquid.fsh
  after: water
  tokens: "uniform float vv_water;"

- type: insert_before
  phase: Declarations
  filename: chunkliquid.fsh
  after: water
  tokens: "uniform float vv_water;"
  content: |
    #define VV_WATER_CAUSTICS 1
